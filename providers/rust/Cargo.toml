[package]
name = "liquid-provider"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "A reference provider agent for Liquid Inference, for one text, image, speech or video deployment"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
futures-util = "0.3.34"
hmac = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
